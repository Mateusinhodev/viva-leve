<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ⚠️ Depois de publicar, troque https://viva-leve.vercel.app pelo endereço real do site -->

    <!-- Básico: aparece na aba do navegador e no Google -->
    <title>Viva Leve · Calculadoras de saúde e controle de peso</title>
    <meta
      name="description"
      content="Calcule seu IMC, taxa metabólica basal, água recomendada e massa magra. Registre seu peso e acompanhe sua evolução em um gráfico. Grátis e sem cadastro."
    />
    <link rel="canonical" href="https://viva-leve.vercel.app/" />
    <meta name="theme-color" content="#3b4554" />

    <!-- Ícone da aba -->
    <link rel="icon" type="image/svg+xml" href="/image.png" />

    <!-- Open Graph: cartão ao colar o link no WhatsApp, LinkedIn, Facebook... -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Viva Leve" />
    <meta property="og:title" content="Viva Leve · Controle do seu peso e da sua saúde" />
    <meta
      property="og:description"
      content="Calculadoras de IMC, TMB, água e massa magra, e um gráfico para acompanhar seu progresso. Grátis e sem cadastro."
    />
    <meta property="og:url" content="https://viva-leve.vercel.app/" />
    <meta property="og:image" content="https://viva-leve.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Viva Leve: painel com IMC, evolução do peso e consumo de água" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonte Lato (pesos usados no site) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
